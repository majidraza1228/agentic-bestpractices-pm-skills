<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-field="meta.title">Product Dashboard</title>
  <style>
    :root {
      --color-bg:          #f8fafc;
      --color-surface:     #ffffff;
      --color-border:      #e2e8f0;
      --color-primary:     #2563eb;
      --color-primary-dim: #eff6ff;
      --color-text:        #0f172a;
      --color-muted:       #64748b;
      --color-up:          #16a34a;
      --color-down:        #dc2626;
      --color-banner-bg:   #fefce8;
      --color-banner-text: #854d0e;
      --radius:            8px;
      --shadow:            0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Prototype banner ─────────────────────────────────────────────────── */
    .prototype-banner {
      background: var(--color-banner-bg);
      color: var(--color-banner-text);
      text-align: center;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .03em;
      border-bottom: 1px solid #fde68a;
    }

    /* ── Page layout ──────────────────────────────────────────────────────── */
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    .page-header {
      margin-bottom: 32px;
    }

    .page-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 4px;
    }

    .page-header .subtitle {
      font-size: 14px;
      color: var(--color-muted);
    }

    /* ── Metric cards ─────────────────────────────────────────────────────── */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--color-muted);
      margin-bottom: 12px;
    }

    #metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .metric-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
    }

    .metric-label {
      font-size: 13px;
      color: var(--color-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .metric-trend {
      font-size: 13px;
      font-weight: 600;
    }
    .trend-up   { color: var(--color-up); }
    .trend-down { color: var(--color-down); }

    /* ── Table section ────────────────────────────────────────────────────── */
    .table-section {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-header h2 {
      font-size: 15px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      padding: 10px 24px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--color-muted);
      background: #f8fafc;
      border-bottom: 1px solid var(--color-border);
    }

    tbody tr {
      border-bottom: 1px solid var(--color-border);
      transition: background .1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }

    tbody td {
      padding: 14px 24px;
      font-size: 14px;
      color: var(--color-text);
    }

    /* ── Badges ───────────────────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Priority badges */
    .badge-priority.badge-high    { background: #fef2f2; color: #b91c1c; }
    .badge-priority.badge-medium  { background: #fffbeb; color: #b45309; }
    .badge-priority.badge-low     { background: #f0fdf4; color: #15803d; }

    /* Status badges */
    .badge-status.badge-in-discovery { background: #eff6ff; color: #1d4ed8; }
    .badge-status.badge-planned      { background: #f5f3ff; color: #6d28d9; }
    .badge-status.badge-backlog      { background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; }
    .badge-status.badge-in-progress  { background: #ecfdf5; color: #065f46; }
    .badge-status.badge-done         { background: #f0fdf4; color: #15803d; }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    .page-footer {
      margin-top: 40px;
      text-align: center;
      font-size: 12px;
      color: var(--color-muted);
    }

    @media (max-width: 640px) {
      .page { padding: 16px 12px 48px; }
      #metrics-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .metric-value { font-size: 22px; }
      thead th, tbody td { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>

  <div class="prototype-banner">
    PROTOTYPE &mdash; placeholder data &middot; last updated <span data-field="meta.updated">—</span>
  </div>

  <div class="page">

    <header class="page-header">
      <h1 data-field="meta.title">Product Dashboard</h1>
      <p class="subtitle" data-field="meta.subtitle">—</p>
    </header>

    <p class="section-title">Key Metrics</p>
    <div id="metrics-grid">
      <!-- Populated by data-loader.js from data.metrics -->
    </div>

    <section class="table-section">
      <div class="table-header">
        <h2 data-field="table.title">—</h2>
      </div>
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body">
          <!-- Populated by data-loader.js from data.table -->
        </tbody>
      </table>
    </section>

    <footer class="page-footer">
      Prototype &mdash; <span data-field="meta.title">—</span> &middot; <span data-field="meta.updated">—</span>
    </footer>

  </div>

  <!-- ── STATIC DATA ─────────────────────────────────────────────────────────
       Edit this block to update placeholder data.
       To switch to live data:
         1. Set DATA_SOURCE.type = 'api' (or 'csv') in js/data-loader.js
         2. Set DATA_SOURCE.url to your endpoint or file path
         3. Remove this block (optional — the loader ignores it in api/csv mode)
  ──────────────────────────────────────────────────────────────────────────── -->
  <script id="page-data" type="application/json">
{
  "meta": {
    "title": "Product Dashboard",
    "subtitle": "Q2 2025 — Replace with your product name",
    "updated": "June 2025"
  },
  "metrics": [
    {
      "label": "Monthly Active Users",
      "value": "12,847",
      "trend": "+8%",
      "trend_dir": "up",
      "_source": "analytics DB — events.monthly_active_users"
    },
    {
      "label": "Conversion Rate",
      "value": "3.2%",
      "trend": "+0.4pp",
      "trend_dir": "up",
      "_source": "analytics DB — funnels.signup_to_active"
    },
    {
      "label": "Avg. Session Length",
      "value": "4m 12s",
      "trend": "-0:18",
      "trend_dir": "down",
      "_source": "analytics DB — sessions.avg_duration"
    },
    {
      "label": "NPS Score",
      "value": "42",
      "trend": "+3",
      "trend_dir": "up",
      "_source": "survey tool API — /v1/nps/latest"
    }
  ],
  "table": {
    "title": "Top Feature Requests",
    "columns": ["Feature", "Votes", "Priority", "Status"],
    "rows": [
      ["AI-powered search",    "284", "High",   "In Discovery"],
      ["Bulk export",          "201", "High",   "Planned"],
      ["Custom dashboards",    "178", "Medium", "Backlog"],
      ["Slack integration",    "142", "Medium", "In Progress"],
      ["Mobile app",           "98",  "Low",    "Backlog"],
      ["Audit log",            "87",  "High",   "In Progress"],
      ["SSO / SAML",           "76",  "High",   "Planned"]
    ],
    "_source": "product DB — feature_requests, ordered by votes DESC"
  }
}
  </script>

  <script src="js/data-loader.js"></script>
</body>
</html>
